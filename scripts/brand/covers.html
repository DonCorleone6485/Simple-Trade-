<!doctype html>
<html><head><meta charset="utf-8">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
/* Marka kapakları. Renkler src/index.css ile aynı: zemin #08080c, altın #f0b429.
   Sol alt köşe profil resmiyle örtüşür (X, LinkedIn, Facebook): metin ve logo
   orta-sağda durur. Boyut: ?c=x | li | fb. */
:root{--ground:#08080c;--ink:#F4F2EC;--gold:#f0b429}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ground)}
.cover{position:relative;overflow:hidden;color:var(--ink);font-family:"Newsreader",Georgia,serif;
  background:
    radial-gradient(70% 140% at 50% -30%,rgba(139,92,246,.20),transparent 60%),
    radial-gradient(50% 90% at 95% 10%,rgba(56,189,248,.06),transparent 65%),
    var(--ground);
  display:flex;align-items:center}
.cover::after{content:"";position:absolute;inset:0;border-bottom:1px solid rgba(255,255,255,.06)}
.body{position:absolute;display:flex;flex-direction:column}
h1{font-weight:400;letter-spacing:-.01em;line-height:1.08}
h1 em{color:var(--gold);font-style:italic}
.url{font-family:Inter,system-ui,sans-serif;font-weight:500;color:rgba(244,242,236,.55);letter-spacing:.04em}
img{display:block;align-self:flex-start;object-position:left center;padding-bottom:0}
.x{width:1500px;height:500px}
.x .body{left:470px;right:80px;top:0;bottom:0;justify-content:center;gap:26px}
.x h1{font-size:74px}.x .url{font-size:22px}.x img{height:38px;width:auto;object-fit:contain}
.li{width:1128px;height:191px}
.li .body{left:330px;right:50px;top:0;bottom:0;justify-content:center;gap:12px}
.li h1{font-size:40px}.li .url{font-size:14px}.li img{display:none}
.fb{width:820px;height:312px}
.fb .body{left:290px;right:40px;top:0;bottom:0;justify-content:center;gap:16px}
.fb h1{font-size:44px}.fb .url{font-size:14px}.fb img{height:24px;width:auto;object-fit:contain}
</style></head>
<body>
<div id="c" class="cover"><div class="body">
  <img src="../../public/brand/stj-mark-white.svg" alt="">
  <h1>Every trade recorded.<br><em>Every mistake visible.</em></h1>
  <div class="url">simpletradejournal.io</div>
</div></div>
<script>document.getElementById('c').classList.add(new URLSearchParams(location.search).get('c')||'x')</script>
</body></html>
