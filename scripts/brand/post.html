<!doctype html>
<html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Newsreader:ital,opsz,wght@0,6..72,400;1,6..72,400&family=Inter:wght@500&display=swap" rel="stylesheet">
<style>
/* Paylaşım kartı. Parametreler: ?f=ig|sq|x &t=başlık &g=altın vurgu &s=alt metin &n=1/5
   Renkler docs/brand-kit.md ile aynı. */
:root{--ground:#08080c;--ink:#F4F2EC;--gold:#f0b429}
*{box-sizing:border-box;margin:0}
html,body{background:var(--ground)}
.card{position:relative;overflow:hidden;color:var(--ink);font-family:"Newsreader",Georgia,serif;
  display:flex;flex-direction:column;justify-content:space-between;
  background:radial-gradient(80% 60% at 50% -10%,rgba(139,92,246,.22),transparent 62%),
             radial-gradient(60% 40% at 100% 0,rgba(56,189,248,.06),transparent 65%),var(--ground)}
.ig{width:1080px;height:1350px;padding:96px 88px}
.sq{width:1080px;height:1080px;padding:84px 88px}
.x{width:1600px;height:900px;padding:80px 110px}
.top,.bottom{display:flex;justify-content:space-between;align-items:center}
.top img{height:54px;width:auto}
.n{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:26px;color:rgba(244,242,236,.45);letter-spacing:.08em}
h1{font-weight:400;letter-spacing:-.015em;line-height:1.06;text-wrap:balance}
.ig h1{font-size:118px}.sq h1{font-size:104px}.x h1{font-size:112px}
h1 em{color:var(--gold);font-style:italic}
.s{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:38px;line-height:1.4;color:rgba(244,242,236,.72);margin-top:38px;max-width:820px}
.x .s{font-size:36px;max-width:1100px}
.url{font-family:Inter,system-ui,sans-serif;font-weight:500;font-size:28px;color:rgba(244,242,236,.5);letter-spacing:.04em}
.mid{display:flex;flex-direction:column}
</style></head><body>
<div id="c" class="card"><div class="top"><img src="../../public/brand/stj-mark-white.svg" alt=""><span class="n" id="n"></span></div>
<div class="mid"><h1 id="t"></h1><p class="s" id="s"></p></div>
<div class="bottom"><span class="url">simpletradejournal.io</span></div></div>
<script>
const q=new URLSearchParams(location.search);
document.getElementById('c').classList.add(q.get('f')||'ig');
const t=q.get('t')||'',g=q.get('g')||'';
const h=document.getElementById('t');h.textContent=t+(g?' ':'');
if(g){const e=document.createElement('em');e.textContent=g;h.appendChild(e)}
document.getElementById('s').textContent=q.get('s')||'';
document.getElementById('n').textContent=q.get('n')||'';
if(!q.get('s'))document.getElementById('s').remove();
</script></body></html>
