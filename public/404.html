<!doctype html>
<html lang="tr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <title>Sayfa bulunamadı · Page not found — Simple Trading Journal</title>
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <!-- Kasıtlı olarak tek dosya: uygulama paketine ve yazı tiplerine
         bağımlı değil, her durumda açılıyor. -->
    <style>
      :root { color-scheme: dark; }
      * { box-sizing: border-box; }
      body {
        margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
        background: radial-gradient(900px 500px at 15% 0%, rgba(139,92,246,0.18), transparent 70%), #0d0e1a;
        color: #f4f4f6; font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
        padding: 24px;
      }
      main { max-width: 480px; text-align: center; }
      .code { font-family: Georgia, "Times New Roman", serif; font-size: 96px; line-height: 1; color: #f0b429; letter-spacing: -0.03em; }
      h1 { font-family: Georgia, "Times New Roman", serif; font-weight: 500; font-size: 28px; margin: 18px 0 6px; }
      p { color: rgba(255,255,255,0.6); line-height: 1.6; margin: 0; }
      .en { color: rgba(255,255,255,0.5); margin-top: 18px; }
      a {
        display: inline-block; margin-top: 30px; padding: 12px 26px; border-radius: 999px;
        background: #8b5cf6; color: #fff; text-decoration: none; font-weight: 600; font-size: 15px;
      }
      a:hover { background: #7c3aed; }
    </style>
  </head>
  <body>
    <main>
      <div class="code">404</div>
      <h1>Bu sayfa bulunamadı</h1>
      <p>Aradığın adres taşınmış ya da hiç var olmamış olabilir.</p>
      <p class="en">Page not found — the address may have moved or never existed.</p>
      <a href="/">Ana sayfaya dön · Back to home</a>
    </main>
  </body>
</html>
